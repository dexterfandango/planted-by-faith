<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Handmade-paper texture: fine fibres + soft mottling, tiled behind the header. -->
  <filter id="fibre"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .25  0 0 0 -1.6 1.05"/></filter>
  <filter id="mottle"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .45  0 0 0 0 .35  0 0 0 -1 .62"/></filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity=".5"/>
  <rect width="100%" height="100%" filter="url(#fibre)" opacity=".55"/>
</svg>
